<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>S Hub · Socin</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="/brand/icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/brand.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{display:grid;grid-template-columns:248px 1fr;font-size:14px;line-height:1.5}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;overflow:auto}
.brand{display:flex;align-items:center;gap:11px;padding:2px 8px 18px;cursor:pointer}
.brand img{width:38px;height:38px;border-radius:11px}.brand b{display:block;font-size:19px;line-height:1.1;letter-spacing:-.01em}.brand small{color:var(--mut);font-size:11.5px}
.grp{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:16px 10px 6px}
.nav{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:var(--r1);cursor:pointer;color:var(--tx);font-weight:500;position:relative}
.nav:hover{background:var(--hover)}.nav.on{background:var(--hover);color:var(--acc-t)}.nav.on::before{content:"";position:absolute;left:-12px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--sun)}
.nav .i{width:22px;text-align:center;font-size:16px}.nav .n{flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}.dot.on{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 22%,transparent)}.dot.off{background:var(--bad)}
.foot{margin-top:auto;padding:14px 10px 2px;color:var(--mut);font-size:11.5px;border-top:1px solid var(--line)}
main{display:flex;flex-direction:column;min-width:0;height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:14px 26px;border-bottom:1px solid var(--line);background:var(--side)}
.top h1{font-size:18px;margin:0;font-weight:700}.top .sub{color:var(--mut);font-size:13px;flex:1}
.view{flex:1;overflow:auto;padding:24px 26px 40px}
iframe{flex:1;border:0;width:100%;background:var(--bg)}
.msg{margin:60px auto;max-width:460px;text-align:center;color:var(--mut)}.msg .big{font-size:42px}.msg h3{color:var(--tx);margin:8px 0}
h2.sec{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:30px 0 12px}
h2.sec:first-child{margin-top:0}
.flow{display:grid;grid-template-columns:1fr 28px 1fr 28px 1fr;align-items:stretch;gap:0}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:20px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r3);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.step .num{width:26px;height:26px;border-radius:50%;background:var(--sun);color:#2A1A00;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
.step .hd{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px}.step p{margin:0;color:var(--mut);flex:1}
.step .st{font-size:12.5px;color:var(--mut);display:flex;align-items:center;gap:7px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--acc);transform:translateY(-1px)}.tile .e{font-size:24px}.tile b{display:block}.tile span{color:var(--mut);font-size:12.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--shadow)}.kpi span{color:var(--mut);font-size:12.5px}.kpi b{display:block;font-size:22px;margin-top:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.pill{padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.bad{background:var(--bad-bg);color:var(--bad)}
.mut{color:var(--mut);font-size:12.5px}
@media(max-width:900px){body{grid-template-columns:1fr}aside{display:none}.flow{grid-template-columns:1fr}.arrow{transform:rotate(90deg);height:24px}}
</style></head><body>
<aside>
 <div class="brand" data-go="home"><img src="/brand/icon.svg" alt="S Hub"><span><b>S Hub</b><small>by Socin</small></span></div>
 <div class="nav on" data-go="home"><span class="i">🏠</span><span class="n">Tổng quan</span></div>
 <div class="grp">Dựng &amp; kiểm thử</div><div id="n_dev"></div>
 <div class="grp">Mã nguồn &amp; Claude</div><div id="n_src"></div>
 <div class="grp">Máy chủ</div><div id="n_srv"></div>
 <div class="grp">Ứng dụng Socin</div><div id="n_app"></div>
 <div class="foot">© Socin.org<br><span id="clock"></span></div>
</aside>
<main>
 <div class="top"><h1 id="ttl">Tổng quan</h1><span class="sub" id="sub">Mọi công cụ của Socin trong một nơi</span>
  <button class="ghost" id="reload" style="display:none">Tải lại</button><button class="ghost" id="pop" style="display:none">Mở cửa sổ riêng</button></div>
 <div class="view" id="home"></div><iframe id="fr" style="display:none" title="app"></iframe><div class="view" id="msgv" style="display:none"><div class="msg" id="msg"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);let apps=[],cur='home',reports=[],servers=[];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const GROUP={build:'n_dev',xpub:'n_dev',test:'n_dev',vps:'n_srv',github:'n_src',creator:'n_src',files:'n_src',claude:'n_src'};
const SUB={home:'Mọi công cụ của Socin trong một nơi',build:'Dựng app Mac, Windows, Android, iOS từ repo GitHub',test:'Lint, build, test, bảo mật và giao diện cho repo GitHub',xpub:'Tạo cụm 12 từ và xpub nạp USDT BEP20, chạy offline',vps:'Deploy từ GitHub, backup, Docker, dọn rác tự động'};
const A=id=>apps.find(a=>a.id===id)||{};
const dotCls=a=>a.online===true?'on':a.online===false?'off':'';
async function load(){
 try{apps=(await (await fetch('/api/apps')).json()).apps}catch{apps=[]}
 try{reports=(await (await fetch('/api/reports?all=1')).json()).reports}catch{reports=[]}
 try{servers=(await (await fetch('/api/vps/servers')).json()).servers||[]}catch{servers=[]}
 nav();if(cur==='home')home()}
function nav(){
 const mk=a=>`<div class="nav ${cur===a.id?'on':''}" data-go="${a.id}"><span class="i">${a.icon||'📦'}</span><span class="n">${esc(a.name)}</span><i class="dot ${dotCls(a)}"></i></div>`;
 ['n_dev','n_src','n_srv','n_app'].forEach(g=>$(g).innerHTML=apps.filter(a=>(GROUP[a.id]||'n_app')===g).map(mk).join(''));
 document.querySelectorAll('[data-go]').forEach(n=>n.onclick=()=>go(n.dataset.go));
 document.querySelector('aside .nav[data-go=home]').classList.toggle('on',cur==='home')}
function stateOf(a){return a.online?'<i class="dot on"></i>Đang chạy':a.canStart?'<i class="dot"></i>Sẵn sàng khởi động':'<i class="dot off"></i>Chưa chạy'}
function home(){
 const last=reports[0];const fails=reports.filter(r=>r.failed).length;
 const b=A('build'),t=A('test'),v=A('vps');
 $('home').innerHTML=`
 <h2 class="sec">Quy trình phát hành</h2>
 <div class="flow">
  <div class="step"><div class="hd"><span class="num">1</span>Kiểm thử</div><p>Chạy lint, build, test, quét khóa bí mật và thử giao diện cho repo trước khi phát hành.</p><div class="st">${last?`Lần gần nhất: <span class="pill ${last.failed?'bad':'ok'}">${last.failed?last.failed+' lỗi':'đạt'}</span> ${esc(last.repo)}`:'Chưa có lần chạy nào'}</div><button class="cta" data-go="test">Mở S Test Hub</button></div>
  <div class="arrow">›</div>
  <div class="step"><div class="hd"><span class="num">2</span>Dựng app</div><p>Build app Mac, Windows, Android, iOS ngay trên MacBook, không tốn GitHub Actions.</p><div class="st">${stateOf(b)}</div><button class="cta" data-go="build">Mở S Build Hub</button> <button class="ghost s" data-go="xpub" title="Tạo cụm 12 từ và xpub cho S Prime CopyTrade Pay">🔑 S Xpub</button></div>
  <div class="arrow">›</div>
  <div class="step"><div class="hd"><span class="num">3</span>Triển khai</div><p>Đưa mã lên VPS, tự cập nhật, backup nhiều phiên bản, quản lý Docker và dọn rác.</p><div class="st">${servers.length?`<i class="dot on"></i>${servers.length} server đã thêm`:'<i class="dot"></i>Chưa thêm server'}</div><button class="cta" data-go="vps">Mở S VPS</button></div>
 </div>
 <h2 class="sec">Trạng thái nhanh</h2>
 <div class="kpis">
  <div class="kpi"><span>Lần kiểm thử gần đây</span><b>${reports.length}</b></div>
  <div class="kpi"><span>Có lỗi cần xem</span><b style="color:${fails?'var(--bad)':'var(--ok)'}">${fails}</b></div>
  <div class="kpi"><span>Server VPS</span><b>${servers.length}</b></div>
  <div class="kpi"><span>Công cụ đang chạy</span><b>${apps.filter(a=>a.online===true).length}/${apps.filter(a=>a.online!==null).length}</b></div>
 </div>
 <h2 class="sec">Ứng dụng Socin</h2>
 <div class="tiles">${apps.filter(a=>a.type==='launch').map(a=>`<div class="tile" data-go="${a.id}"><span class="e">${a.icon||'📦'}</span><span><b>${esc(a.name)}</b><span>${esc(a.desc||'')}</span></span></div>`).join('')||'<span class="mut">Chưa cấu hình ứng dụng nào trong config.json</span>'}</div>
 <h2 class="sec">Kiểm thử gần đây</h2>
 <div class="list">${reports.slice(0,6).map(p=>`<div class="row"><span><b>${esc(p.repo)}</b></span><span><span class="pill ${p.failed?'bad':'ok'}">${p.failed?p.failed+' lỗi':'đạt'}</span> <span class="mut">${new Date(p.at).toLocaleString('vi-VN')}</span></span></div>`).join('')||'<div class="row mut">Chưa có lần chạy nào. Mở S Test Hub để kiểm thử repo đầu tiên.</div>'}</div>`;
 document.querySelectorAll('#home [data-go]').forEach(n=>n.onclick=()=>go(n.dataset.go))}
function show(mode){$('home').style.display=mode==='home'?'block':'none';$('fr').style.display=mode==='fr'?'block':'none';$('msgv').style.display=mode==='msg'?'block':'none';$('reload').style.display=$('pop').style.display=mode==='fr'?'':'none'}
function say(icon,title,html){show('msg');$('msg').innerHTML=`<div class="big">${icon}</div><h3>${title}</h3><div>${html}</div>`}
async function go(id){
 cur=id;location.hash=id;nav();$('sub').textContent=SUB[id]||'';
 if(id==='home'){$('ttl').textContent='Tổng quan';show('home');return load()}
 const a=A(id);if(!a.id)return;$('ttl').textContent=a.name;
 if(a.type==='launch'){const r=await fetch('/api/launch',{method:'POST',body:JSON.stringify({id})}).then(r=>r.json());return r.error?say('⚠️','Chưa mở được',esc(r.error)):say(a.icon||'🚀','Đã mở '+esc(a.name),'Ứng dụng chạy ở cửa sổ riêng trên máy của bạn.')}
 let u=a.online?a.url:null;
 if(!u&&a.canStart){say('⏳','Đang khởi động '+esc(a.name),'Vui lòng chờ vài giây…');await fetch('/api/launch',{method:'POST',body:JSON.stringify({id})});
  for(let i=0;i<20&&!u;i++){await new Promise(r=>setTimeout(r,1500));await load();const n=A(id);if(n.online)u=n.url}}
 if(!u)return say('🔌',esc(a.name)+' chưa chạy','Hãy mở app này lên rồi bấm lại. Hoặc điền <code>url</code> và <code>startCommand</code> cho "'+esc(a.id)+'" trong config.json để S Hub tự khởi động.');
 show('fr');$('fr').src=u;$('pop').onclick=()=>window.open(u,'_blank');$('reload').onclick=()=>{$('fr').src=u}}
setInterval(()=>{$('clock').textContent=new Date().toLocaleString('vi-VN')},1000);
setInterval(()=>fetch('/api/apps').then(r=>r.json()).then(d=>{apps=d.apps;nav()}).catch(()=>{}),15000);
load().then(()=>{const h=location.hash.slice(1);if(h&&h!=='home')go(h)});
</script></body></html>
