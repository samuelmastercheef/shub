<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>S Test Hub</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,sans-serif}
header{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:center}
header h1{font-size:17px;margin:0}header small{color:var(--mut)}
main{display:grid;grid-template-columns:340px 1fr;gap:16px;padding:16px 24px;height:calc(100vh - 56px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;overflow:auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
input,select{width:100%;background:var(--in);border:1px solid var(--line);color:var(--tx);padding:8px;border-radius:6px;margin-bottom:8px}
button{border:0;border-radius:6px;padding:8px 12px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}button:disabled{opacity:.5}
.repo{display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.repo:hover{background:var(--hover)}.repo.sel{border-color:var(--acc);background:var(--hover)}.repo span{font-size:12px;color:var(--mut)}
.checks label{display:inline-block;margin:0 12px 6px 0;color:var(--tx)}
.step{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--mut)}
.pass .dot{background:var(--ok)}.fail .dot{background:var(--bad)}.skip .dot{background:var(--warn)}.running .dot{background:var(--acc);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}.step pre{margin:4px 0 0;white-space:pre-wrap;color:var(--mut);font-size:12px;max-height:160px;overflow:auto}
#log{background:var(--logbg);border-radius:8px;padding:10px;height:260px;overflow:auto;white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--logtx)}
.sum{font-size:16px;font-weight:700;margin:6px 0 10px}.pill{padding:2px 8px;border-radius:99px;font-size:12px;margin-right:6px}
.right{display:flex;flex-direction:column;gap:16px;overflow:auto}img{max-width:100%;border-radius:8px;border:1px solid var(--line)}
.hist{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
html.embed header{display:none}html.embed main{height:100vh}
.tp[hidden]{display:none}.hist b{font-weight:600}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/brand.css"><script src="/charts.js"></script><link rel="icon" href="/brand/socin-icon.svg"></head><body>
<header><h1>S Test Hub</h1><small id="env"></small></header>
<main>
<div class="card"><h2>Repo GitHub</h2>
<input id="q" placeholder="Tìm repo…">
<div id="repos"></div>
<h2 style="margin-top:14px">Hoặc nhập URL</h2>
<input id="url" placeholder="https://github.com/owner/repo.git">
<input id="branch" placeholder="Nhánh (để trống = mặc định)">
<div class="checks" id="checks">
<label><input type="checkbox" data-k="lint" checked> Lint</label>
<label><input type="checkbox" data-k="typecheck" checked> Type-check</label>
<label><input type="checkbox" data-k="build" checked> Build</label>
<label><input type="checkbox" data-k="test" checked> Test</label>
<label><input type="checkbox" data-k="security" checked> Bảo mật</label>
<label><input type="checkbox" data-k="ui" checked> Giao diện</label></div>
<button id="go" class="cta" style="width:100%;margin-top:6px">Chạy kiểm tra</button>
</div>
<div class="right">
<div class="tabs" id="tabs"><button data-t="res" class="on">Kết quả</button><button data-t="log">Nhật ký</button><button data-t="hist">Lịch sử</button><button data-t="stat">Thống kê</button></div>
<div class="card tp" id="tp_res"><h2 id="title">Kết quả</h2><div id="sum"></div><div id="steps"></div><div id="shot"></div></div>
<div class="card tp" id="tp_log" hidden><h2>Nhật ký chạy</h2><div id="log"></div></div>
<div class="card tp" id="tp_hist" hidden><h2>Lịch sử chạy</h2>
 <div style="display:flex;gap:8px"><input id="hq" placeholder="Lọc theo repo…"><select id="hs" style="width:150px"><option value="">Tất cả</option><option value="ok">Đạt</option><option value="fail">Có lỗi</option></select></div>
 <div id="hist"></div><div id="hpg"></div></div>
<div class="card tp" id="tp_stat" hidden><h2>Thống kê</h2><div id="stat"></div></div>
</div></main>
<script>
if(self!==top)document.documentElement.classList.add('embed');
const $=id=>document.getElementById(id);let repos=[],sel=null;
const icon={pass:'Đạt',fail:'Lỗi',skip:'Bỏ qua',running:'Đang chạy'};
fetch('/api/env').then(r=>r.json()).then(e=>{$('env').textContent=`Node ${e.node} · git ${e.git?'✓':'✗'} · gh ${e.gh?'✓':'✗'} · Playwright ${e.playwright?'✓':'✗ (chỉ test HTTP)'}`});
fetch('/api/repos').then(r=>r.json()).then(d=>{repos=d.repos;draw();if(!repos.length)$('repos').innerHTML='<span style="color:var(--mut)">'+(d.error?d.error+'. ':'')+'Chưa lấy được danh sách. Điền githubToken vào config.json hoặc chạy <code>gh auth login</code>, hoặc nhập URL bên dưới.</span>'}).catch(()=>{});
function draw(){const q=$('q').value.toLowerCase();$('repos').innerHTML='';repos.filter(r=>r.name.toLowerCase().includes(q)).forEach(r=>{const d=document.createElement('div');d.className='repo'+(sel===r?' sel':'');d.innerHTML=`<b>${r.name}</b><span>${r.private?'private':'public'}</span>`;d.onclick=()=>{sel=r;$('url').value=r.url;draw()};$('repos').appendChild(d)})}
$('q').oninput=draw;
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function render(steps){$('steps').innerHTML=steps.map(s=>`<div class="step ${s.status}"><i class="dot"></i><div><b>${s.name}</b> <span style="color:var(--mut)">· ${icon[s.status]}</span>${s.note?`<pre>${esc(s.note)}</pre>`:''}</div></div>`).join('')}
$('go').onclick=async()=>{
 const url=$('url').value.trim();if(!url)return alert('Chọn repo hoặc nhập URL');
 const name=sel&&sel.url===url?sel.name:url.replace(/^.*github\.com[\/:]/,'').replace(/\.git$/,'');
 const checks={};document.querySelectorAll('#checks input').forEach(i=>checks[i.dataset.k]=i.checked?1:0);
 $('go').disabled=true;$('log').textContent='';$('sum').innerHTML='';$('shot').innerHTML='';$('title').textContent='Kết quả: '+name;
 const r=await fetch('/api/run',{method:'POST',body:JSON.stringify({name,url,branch:$('branch').value.trim(),checks})}).then(r=>r.json());
 if(r.error){alert(r.error);$('go').disabled=false;return}
 const steps=[];const es=new EventSource('/api/stream?id='+encodeURIComponent(r.id));
 es.onmessage=m=>{const e=JSON.parse(m.data);
  if(e.t==='log'){$('log').textContent+=e.s;$('log').scrollTop=1e9}
  else if(e.t==='step'){const i=steps.findIndex(s=>s.name===e.name);i>=0?steps[i]=e:steps.push(e);render(steps)}
  else if(e.t==='done'){es.close();$('go').disabled=false;const p=e.report;
   $('sum').innerHTML=`<div class="sum" style="color:${p.failed?'var(--bad)':'var(--ok)'}">${p.failed?p.failed+' mục lỗi':'Tất cả đạt'} <span style="color:var(--mut);font-weight:400;font-size:13px">· ${p.passed} đạt · ${p.seconds}s</span></div>`;
   const sh=p.results.find(x=>x.screenshot);if(sh)$('shot').innerHTML=`<img src="/reports/${p.id}/${sh.screenshot}">`;hist()}};
 es.onerror=()=>{es.close();$('go').disabled=false}};
try{const pu=localStorage.getItem('shub.prefillUrl');if(pu){document.getElementById('url').value=pu;localStorage.removeItem('shub.prefillUrl')}}catch{}
let HP=1;
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
function tab(t){document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));document.querySelectorAll('.tp').forEach(x=>x.hidden=x.id!=='tp_'+t);if(t==='stat')stats();if(t==='hist')hist()}
function hist(p){if(p)HP=p;const q=encodeURIComponent($('hq').value.trim()),st=$('hs').value;
 fetch(`/api/reports?page=${HP}&size=10&repo=${q}&status=${st}`).then(r=>r.json()).then(d=>{$('hist').innerHTML=d.reports.map(p=>`<div class="hist"><span>${UI.esc(p.repo)}</span><span><span class="pill" style="background:${p.failed?'var(--bad-bg)':'var(--ok-bg)'}">${p.failed?p.failed+' lỗi':'đạt'}</span>${new Date(p.at).toLocaleString('vi-VN')}</span></div>`).join('')||'<span style="color:var(--mut)">Chưa có lần chạy nào</span>';$('hpg').innerHTML=UI.pager(d.total,d.page,d.size,'hist')})}
$('hq').oninput=()=>hist(1);$('hs').onchange=()=>hist(1);
async function stats(){const d=await fetch('/api/reports?all=1').then(r=>r.json()),R=d.reports;if(!R.length){$('stat').innerHTML=UI.empty('Chưa có lần chạy nào');return}
 const okN=R.filter(r=>!r.failed).length,by={};R.forEach(r=>{(by[r.repo]=by[r.repo]||{n:0,f:0}).n++;if(r.failed)by[r.repo].f++});
 const last=R.slice(0,14).reverse().map((r,i)=>({x:new Date(r.at).toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}),y:r.failed||0}));
 $('stat').innerHTML=`<div class="kpis">${UI.kpi('Tổng lần chạy',R.length)}${UI.kpi('Tỉ lệ đạt',Math.round(okN/R.length*100)+'%',{color:'var(--ok)'})}${UI.kpi('Repo đã kiểm',Object.keys(by).length)}</div>
 <div class="grid2"><div><h2>Đạt / lỗi</h2>${UI.donut([{label:'Đạt',value:okN,color:'#3FCB8A'},{label:'Có lỗi',value:R.length-okN,color:'#F2625A'}],{center:Math.round(okN/R.length*100)+'%',sub:'đạt'})}</div>
 <div><h2>Số mục lỗi 14 lần gần nhất</h2>${UI.line(last,{color:'#F2625A'})}</div>
 <div><h2>Repo chạy nhiều nhất</h2>${UI.hbars(Object.entries(by).sort((a,b)=>b[1].n-a[1].n).slice(0,8).map(([k,v])=>({label:k,value:v.n})))}</div></div>`;UI.countUp($('stat'))}
hist();
</script></body></html>
