<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>S Creator</title><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap"><link rel="stylesheet" href="/brand.css"><script src="/charts.js"></script><link rel="icon" href="/brand/socin-icon.svg">
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 'Be Vietnam Pro',-apple-system,sans-serif;padding:18px 24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:16px;margin-bottom:14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin:0 0 10px}
input,select,textarea{background:var(--in);border:1px solid var(--line);color:var(--tx);padding:8px;border-radius:8px;font:inherit;max-width:100%}
textarea{width:100%;min-height:80px}label{display:grid;gap:4px;font-weight:500;margin-bottom:10px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.mut{color:var(--mut)}button.s{padding:4px 10px;font-size:12.5px}.err{color:var(--bad)}[hidden]{display:none!important}
.steps{display:flex;gap:0;margin-bottom:16px;flex-wrap:wrap}.st{flex:1;min-width:120px;padding:10px 12px;border:1px solid var(--line);background:var(--card);cursor:pointer;text-align:center;font-weight:600;font-size:13px}.st:first-child{border-radius:10px 0 0 10px}.st:last-child{border-radius:0 10px 10px 0}.st.on{background:var(--acc);color:#fff;border-color:var(--acc)}.st.done::after{content:' ✓';color:var(--ok)}.st.on.done::after{color:#fff}.st small{display:block;font-weight:400;opacity:.75}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.idea{border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:var(--bg)}.idea.on{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}.idea b{display:block;margin-bottom:4px}
.scenes{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}.sc{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg)}.sc img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:10px;background:var(--track);display:block;margin-bottom:8px}.sc .ph{width:100%;aspect-ratio:9/16;border-radius:10px;background:var(--track);display:grid;place-items:center;color:var(--mut);margin-bottom:8px}
video{width:100%;max-width:360px;border-radius:12px;background:#000}
#msg{position:fixed;right:20px;bottom:20px;background:var(--card);border:1px solid var(--line);padding:10px 14px;border-radius:10px;box-shadow:var(--shadow);max-width:440px;z-index:5}
.busy{opacity:.6;pointer-events:none}
</style></head><body>
<div class="tabs" id="tabs"><button data-t="pj" class="on">Dự án</button><button data-t="wz">Tạo nội dung</button><button data-t="st">Thống kê</button><button data-t="cn">Kết nối</button></div>
<div class="tp" id="tp_pj"></div><div class="tp" id="tp_wz" hidden></div><div class="tp" id="tp_st" hidden></div><div class="tp" id="tp_cn" hidden></div>
<div id="msg" hidden></div>
<script>
const $=id=>document.getElementById(id),E=UI.esc;let P=null,PG=1,SET=null,ACC=[];
const say=(m,b)=>{const x=$('msg');x.textContent=m;x.className=b?'err':'';x.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>x.hidden=true,6500)};
const api=async(p,b)=>{const r=await fetch(p,b?{method:'POST',body:JSON.stringify(b)}:{});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'Lỗi');return d};
const LOAD={pj,wz,st,cn};
function tab(t){document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t));document.querySelectorAll('.tp').forEach(x=>x.hidden=x.id!=='tp_'+t);LOAD[t]()}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
const STEPS=[['concept','1 · Concept'],['ideas','2 · Ý tưởng'],['script','3 · Kịch bản & nội dung'],['images','4 · Hình ảnh'],['video','5 · Video'],['schedule','6 · Lịch đăng']];
let cur='concept';
const busy=async(btn,fn)=>{const t=btn.textContent;btn.disabled=true;btn.textContent='Đang xử lý…';try{await fn()}catch(e){say(e.message,1)}btn.disabled=false;btn.textContent=t};

/* ---- danh sách dự án ---- */
async function pj(p){if(typeof p==='number')PG=p;const d=await api(`/api/cr/projects?page=${PG}&q=${encodeURIComponent(($('pq')||{}).value||'')}`);
 $('tp_pj').innerHTML=`<div class="card"><div class="row"><input id="pq" placeholder="Tìm dự án…" oninput="pj(1)" value="${E(($('pq')||{}).value||'')}" style="flex:1"><button class="cta" id="pn">+ Dự án mới</button></div>
 <table><thead><tr><th>Dự án</th><th>Bước</th><th>Kênh</th><th>Cảnh/Ảnh</th><th>Video</th><th>Lịch</th><th></th></tr></thead><tbody>${d.items.map(x=>`<tr><td><b>${E(x.name)}</b><div class="mut" style="font-size:12px">${E(x.concept)}</div></td><td><span class="badge prv">${E((STEPS.find(s=>s[0]===x.step)||[])[1]||x.step)}</span></td><td>${x.channels.map(E).join(', ')||'—'}</td><td>${x.scenes}/${x.images}</td><td>${x.video==='done'?'<span class="badge pub">xong</span>':x.video==='rendering'?'đang dựng':x.video==='error'?'<span class="badge arc">lỗi</span>':'—'}</td><td>${x.queued} chờ · ${x.sent} đã gửi</td><td style="white-space:nowrap"><button class="ghost s" onclick="open_('${x.id}')">Mở</button> <button class="ghost s" style="color:var(--bad)" onclick="del('${x.id}','${E(x.name).replace(/'/g,'')}')">Xóa</button></td></tr>`).join('')||'<tr><td colspan=7 class="mut">Chưa có dự án. Bấm "Dự án mới" và nhập concept.</td></tr>'}</tbody></table>${UI.pager(d.total,d.page,d.size,'pj')}</div>`;
 $('pn').onclick=()=>{P=null;cur='concept';tab('wz')}}
async function open_(id){P=(await api('/api/cr/project?id='+id)).project;cur=P.step==='concept'?'concept':P.step;tab('wz')}
async function del(id,n){const c=prompt(`Xóa dự án "${n}" cùng ảnh/video?\nGõ đúng tên dự án để xác nhận:`);if(c===null)return;try{await api('/api/cr/project/delete',{id,confirm:c});if(P&&P.id===id)P=null;pj()}catch(e){say(e.message,1)}}

/* ---- trình tạo nội dung ---- */
async function wz(){if(!SET)SET=(await api('/api/cr/settings')).settings;if(SET.socin.hasToken&&!ACC.length){try{ACC=(await api('/api/cr/socin/accounts')).accounts}catch{}}if(P&&P.video&&P.video.status==='rendering')poll();draw()}
function bar(){const idx=STEPS.findIndex(s=>s[0]===cur);const reach=P?Math.max(0,STEPS.findIndex(s=>s[0]===P.step)):0;return `<div class="steps">${STEPS.map((s,i)=>`<div class="st ${s[0]===cur?'on':''} ${P&&i<reach?'done':''}" onclick="go('${s[0]}')">${s[1]}</div>`).join('')}</div>`}
function go(s){if(!P&&s!=='concept')return say('Hãy lưu concept trước',1);cur=s;draw()}
function draw(){const h=bar()+({concept:vConcept,ideas:vIdeas,script:vScript,images:vImages,video:vVideo,schedule:vSchedule}[cur])();$('tp_wz').innerHTML=h;wire()}
const PLAT={tiktok:'TikTok',threads:'Threads',facebook:'Facebook',zalo:'Zalo',youtube:'YouTube'};
function vConcept(){const p=P||{name:'',concept:'',audience:'',tone:'',channels:[]};const on=x=>p.channels.some(c=>c.platform===x);
 return `<div class="card"><h2>Concept</h2><div style="max-width:720px"><label>Tên dự án<input id="c_name" value="${E(p.name)}"></label><label>Concept / ý tưởng gốc<textarea id="c_concept" placeholder="Vd: Chuỗi video ngắn chia sẻ 5 mẹo quản lý vốn khi giao dịch, hình hoạt hình vẽ tay, giọng gần gũi">${E(p.concept)}</textarea></label>
 <div class="row"><label style="flex:1">Đối tượng<input id="c_aud" value="${E(p.audience||'')}" placeholder="Vd: người mới giao dịch, 25-40 tuổi"></label><label style="flex:1">Giọng điệu<input id="c_tone" value="${E(p.tone||'')}" placeholder="Vd: gần gũi, hài hước nhẹ"></label></div>
 <label>Kênh đăng (qua hạ tầng Socin)</label><div class="row">${Object.entries(PLAT).map(([k,v])=>{const cur=(p.channels.find(c=>c.platform===k)||{}).accountId,list=ACC.filter(a=>a.platform===k);return `<div style="display:flex;gap:6px;align-items:center;margin-right:14px"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" class="ch" value="${k}" ${on(k)?'checked':''}> ${v}</label>${list.length?`<select class="ca" data-p="${k}"><option value="">— tài khoản —</option>${list.map(a=>`<option value="${E(a.id)}" ${a.id===cur?'selected':''}>${E(a.display_name||a.name||a.id)}</option>`).join('')}</select>`:''}</div>`}).join('')}</div>
 <div class="row"><button class="cta" id="c_ok">${P?'Lưu concept':'Tạo dự án'}</button>${P?'<button class="ghost" onclick="go(\'ideas\')">Tiếp: Ý tưởng →</button>':''}</div></div></div>`}
function vIdeas(){return `<div class="card"><h2>Ý tưởng</h2><div class="row"><button class="cta" id="i_gen">${P.ideas.length?'Đề xuất lại':'✨ Đề xuất ý tưởng bằng Claude'}</button><span class="mut">Chọn một ý tưởng để viết kịch bản.</span></div>
 <div class="ideas">${P.ideas.map((x,i)=>`<div class="idea ${P.idea===i?'on':''}" data-i="${i}"><b>${E(x.title)}</b><div>${E(x.hook)}</div><div class="mut" style="font-size:12.5px">${E(x.angle)}</div><span class="chip badge prv">${E(x.format)}</span></div>`).join('')||UI.empty('Chưa có ý tưởng')}</div>
 ${P.ideas.length?'<div class="row" style="margin-top:12px"><button class="cta" id="i_sc">Viết kịch bản từ ý tưởng đã chọn →</button></div>':''}</div>`}
function vScript(){if(!P.script)return `<div class="card">${UI.empty('Chưa có kịch bản. Chọn ý tưởng ở bước 2 rồi bấm Viết kịch bản.')}</div>`;const s=P.script;
 return `<div class="card"><h2>Kịch bản · ${s.scenes.length} cảnh · ${s.scenes.reduce((a,x)=>a+x.seconds,0)}s</h2><label>Tiêu đề<input id="s_title" value="${E(s.title)}"></label><label>Hook (hiện lớn trên ảnh/cảnh đầu)<input id="s_hook" value="${E(s.hook)}"></label><label>Nhân vật chính (EN, dùng cho mọi cảnh)<textarea id="s_char" style="min-height:56px">${E(s.character||'')}</textarea></label><label>Phong cách ảnh chung (EN)<input id="s_sty" value="${E(s.style||'')}"></label><div class="row"><button class="ghost" id="s_sync">Claude đồng bộ nhân vật + phong cách + prompt các cảnh</button></div>
 <div class="scenes">${s.scenes.map((x,i)=>`<div class="sc"><b>Cảnh ${i+1}</b> <input type="number" min="2" max="30" class="sx" data-i="${i}" data-k="seconds" value="${x.seconds}" style="width:64px"> giây<label style="margin-top:6px">Lời đọc<textarea class="sx" data-i="${i}" data-k="narration" style="min-height:70px">${E(x.narration)}</textarea></label><label>Chữ trên màn hình<input class="sx" data-i="${i}" data-k="text" value="${E(x.text)}"></label><label>Prompt ảnh (EN)<textarea class="sx" data-i="${i}" data-k="imagePrompt" style="min-height:60px">${E(x.imagePrompt)}</textarea></label></div>`).join('')}</div></div>
 <div class="card"><h2>Caption theo kênh</h2>${Object.entries(s.captions).map(([k,c])=>`<div style="margin-bottom:12px"><b>${PLAT[k]||k}</b><label>Tiêu đề<input class="cx" data-p="${k}" data-k="title" value="${E(c.title)}"></label><label>Nội dung<textarea class="cx" data-p="${k}" data-k="text">${E(c.text)}</textarea></label><label>Hashtag (cách nhau dấu cách)<input class="cx" data-p="${k}" data-k="hashtags" value="${E((c.hashtags||[]).join(' '))}"></label></div>`).join('')}
 <div class="row"><button class="cta" id="s_save">Lưu kịch bản</button><button class="ghost" onclick="go('images')">Tiếp: Hình ảnh →</button></div></div>`}
let DT=null,STOP=false;
function dtBanner(){if(SET.imageApi)return '';if(DT===null){DT={checking:true};api('/api/cr/image/detect').then(r=>{DT=r;draw()}).catch(()=>{DT={found:false};draw()});return '<div class="card mut">Đang tìm Draw Things / server ảnh trên máy…</div>'}
 if(DT.checking)return '<div class="card mut">Đang tìm Draw Things / server ảnh trên máy…</div>';
 if(DT.found)return `<div class="card" style="border:1px solid var(--accent,#0B7F8F)"><b>Phát hiện server ảnh (Draw Things / Stable Diffusion) tại ${E(DT.url)}</b><p class="mut">Bật để vẽ ảnh minh hoạ AI cho từng cảnh thay vì thẻ biểu tượng.</p><button class="cta" id="dt_on">Bật ảnh AI (cấu hình Turbo: 6 bước, CFG 2)</button></div>`;
 return '<div class="card" style="border:1px solid #FFB020"><b>Chưa thấy Draw Things</b><p class="mut">Mở Draw Things → Cài đặt nâng cao → bật <b>API Server</b> (HTTP, cổng 7860) và chọn model. Rồi bấm kiểm tra lại. Trong lúc đó vẫn dùng được thẻ biểu tượng hoặc tải ảnh lên.</p><button class="ghost" id="dt_re">Kiểm tra lại</button></div>'}
function vImages(){if(!P.script)return `<div class="card">${UI.empty('Cần kịch bản trước')}</div>`;const api_=SET.imageApi?'':' (chưa cấu hình server ảnh, xem tab Kết nối)';
 return dtBanner()+`<div class="card"><h2>Hình ảnh theo cảnh</h2><div class="row"><select id="g_src" style="width:auto"><option value="card" ${SET.imageSource==='card'?'selected':''}>Thẻ biểu tượng (nhanh, không cần AI)</option><option value="api" ${SET.imageSource==='api'?'selected':''}>Server ảnh local (Draw Things / SD)${SET.imageApi?'':' – chưa cấu hình'}</option><option value="gemini" ${SET.imageSource==='gemini'?'selected':''}>Gemini${SET.gemini&&SET.gemini.hasKey?'':' – chưa nhập khoá'}</option><option value="claude" ${SET.imageSource==='claude'?'selected':''}>Claude (vẽ vector SVG)</option></select><button class="cta" id="g_ai">Vẽ ảnh cho mọi cảnh</button><span class="mut">Ảnh minh hoạ AI: Claude viết prompt, server ảnh local vẽ (đồng bộ nhân vật/phong cách giữa các cảnh). Thẻ biểu tượng: nền màu + biểu tượng lớn, không cần server${api_}. Hook và chữ trên màn hình được ghép lúc dựng video (xem trước bên dưới).</span><button class="ghost" id="g_stop" hidden>⏹ Dừng</button><span class="mut" id="g_prog"></span>${SET.imageApi?'<button class="ghost s" id="g_seed">Đổi seed (vẽ lại bộ nhân vật mới)</button>':''}</div>
 <div class="scenes">${P.script.scenes.map((x,i)=>{const f=P.images[String(i+1)];return `<div class="sc">${f?`<div style="position:relative"><img src="/cr/file/${P.id}/${f}?t=${P.updated}">${i===0&&P.script.hook?`<div style="position:absolute;left:0;right:0;top:0;padding:10% 6% 14%;background:linear-gradient(180deg,rgba(0,0,0,.7),transparent);color:#FFD34D;font-weight:900;text-align:center;font-size:17px;line-height:1.2;text-shadow:0 2px 8px #000;border-radius:10px 10px 0 0">${E(P.script.hook)}</div>`:''}${x.text?`<div style="position:absolute;left:6%;right:6%;top:72%;text-align:center"><span style="background:rgba(0,0,0,.6);color:#fff;font-weight:700;font-size:13px;padding:4px 8px;border-radius:6px;display:inline-block">${E(x.text)}</span></div>`:''}</div>`:'<div class="ph">Chưa có ảnh</div>'}<b>Cảnh ${i+1}</b><div class="mut" style="font-size:12.5px">${E(x.text||x.narration).slice(0,80)}</div><div class="row" style="margin-top:6px"><button class="ghost s gi" data-i="${i+1}" data-s="card">Thẻ biểu tượng</button>${SET.imageApi?`<button class="ghost s gi" data-i="${i+1}" data-s="api">AI vẽ</button>`:''}<label class="ghost s" style="margin:0;cursor:pointer;display:inline-block;border:1px solid var(--line);border-radius:8px;padding:4px 10px">Tải ảnh<input type="file" accept="image/png,image/jpeg" class="up" data-i="${i+1}" hidden></label></div></div>`}).join('')}</div>
 <div class="row" style="margin-top:12px"><button class="ghost" onclick="go('video')">Tiếp: Video →</button></div></div>`}
const eng0=()=>VO.eng||(SET.videoEngine==='gemini'?'gemini':'ffmpeg');
let VO={eng:null,redraw:false,auto:true,voice:true,cap:true};
function vVideo(){if(!P.script)return `<div class="card">${UI.empty('Cần kịch bản và ảnh trước')}</div>`;const v=P.video||{};
 return `<div class="card"><h2>Video dọc 9:16</h2>${(()=>{const n=P.script.scenes.length,have=P.script.scenes.map((_,i)=>P.images[String(i+1)]).filter(Boolean).length;return `<div class="mut" style="margin-bottom:6px">Ảnh các cảnh: <b>${have}/${n}</b> đã có${have<n?' (cảnh thiếu sẽ được tự vẽ nếu bật tuỳ chọn bên dưới)':' — video sẽ dùng đúng các ảnh này'}</div><div class="row" style="gap:6px;flex-wrap:nowrap;overflow-x:auto;margin-bottom:8px">${P.script.scenes.map((_,i)=>{const f=P.images[String(i+1)];return f?`<img src="/cr/file/${P.id}/${f}?t=${P.updated}" style="height:96px;border-radius:6px" title="Cảnh ${i+1}">`:`<div class="mut" style="height:96px;width:54px;border:1px dashed var(--line,#444);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px">C${i+1}</div>`}).join('')}</div>`})()}<div class="row"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="v_voice" ${VO.voice?'checked':''}> Giọng đọc (${SET.engine==='cit'?'CIT Voice Studio':'macOS '+E(SET.voice)})</label><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="v_cap" ${VO.cap?'checked':''}> Chữ trên video</label><label style="display:flex;gap:6px;align-items:center;margin:0">Engine <select id="v_eng" style="width:auto"><option value="ffmpeg" ${eng0()==='ffmpeg'?'selected':''}>Ảnh động ffmpeg (dùng ảnh các cảnh, miễn phí)</option><option value="drawthings" ${eng0()==='drawthings'?'selected':''}>Draw Things: vẽ ảnh AI từng cảnh rồi dựng chuyển động${SET.imageApi?'':' – chưa cấu hình'}</option><option value="gemini" ${eng0()==='gemini'?'selected':''}>Gemini tạo clip từng cảnh${SET.gemini&&SET.gemini.hasKey?'':' – chưa nhập khoá'}</option></select></label><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="v_redraw" ${VO.redraw?'checked':''}> Vẽ lại ảnh mọi cảnh (Draw Things)</label><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="v_auto" ${VO.auto?'checked':''}> Tự vẽ ảnh cảnh còn thiếu (${E(SET.imageSource||'card')})</label><button class="cta" id="v_go" ${v.status==='rendering'?'disabled':''}>${v.status==='rendering'?'Đang dựng…':'Dựng video'}</button></div>
 ${v.status==='rendering'?'<p class="mut">Đang dựng, trang tự cập nhật… <button class="ghost s" id="v_stop">⏹ Dừng</button></p>':''}${v.status==='cancelled'?'<p class="mut">Đã dừng dựng video. Bấm dựng lại khi cần.</p>':''}${v.status==='error'?`<p class="err">${E(v.error)}</p>`:''}
 ${v.status==='done'||P.hasVideo?`<video controls src="/cr/file/${P.id}/video.mp4?t=${v.at||0}"></video><p class="mut">${v.seconds||'?'}s · ${UI.fmtBytes(v.bytes||0)} · file nằm trong Kho file → danh mục "creator" · <a href="/cr/file/${P.id}/video.srt" target="_blank">phụ đề .srt</a> · <a href="/cr/file/${P.id}/cover.png" target="_blank">ảnh bìa có hook</a>${v.voiceEngine?' · giọng '+E(v.voiceEngine):''}${v.warn?'<br>⚠️ '+E(v.warn):''}</p><button class="ghost" onclick="go('schedule')">Tiếp: Lịch đăng →</button>`:''}</div>`}
function vSchedule(){if(!P.script)return `<div class="card">${UI.empty('Cần nội dung trước')}</div>`;const d=new Date(Date.now()+864e5).toISOString().slice(0,10);
 return `<div class="card"><h2>Lên lịch đăng</h2>${P.channels.length?'':'<p class="err">Chưa chọn kênh ở bước Concept.</p>'}<div class="row"><label style="margin:0">Ngày<input type="date" id="l_date" value="${d}"></label><label style="margin:0">Giờ đăng<select id="l_hour">${[7,8,9,11,12,17,18,19,20,21].map(h=>`<option value="${h}" ${h===19?'selected':''}>${h}:00</option>`).join('')}</select></label><label style="margin:0">Giãn cách giữa kênh (phút)<input type="number" id="l_gap" value="10" min="0" max="30" style="width:90px"></label><button class="cta" id="l_plan">Tạo lịch</button></div>
 <p class="mut">Mục "Tự đẩy": S Hub chuyển bài sang Socin trước giờ đăng 5 phút (cần S Hub đang chạy); Socin giữ bài ở trạng thái chờ duyệt rồi tự đăng đúng giờ. Kênh "Xuất gói" chỉ copy nội dung + video ra thư mục để đăng tay.</p>
 <table><thead><tr><th>Kênh</th><th>Giờ</th><th>Cách đăng</th><th>Trạng thái</th><th></th></tr></thead><tbody>${(P.schedule||[]).map(x=>`<tr><td><b>${PLAT[x.platform]||x.platform}</b><div class="mut" style="font-size:12px">${E(x.accountName||x.accountId||'(chưa chọn tài khoản)')}</div></td><td><input type="datetime-local" class="lt" data-id="${x.id}" value="${new Date(new Date(x.runAt)-new Date(x.runAt).getTimezoneOffset()*6e4).toISOString().slice(0,16)}" ${x.status==='sent'?'disabled':''}></td><td>${x.adapter==='export'?'Xuất gói':'Socin'}${x.adapter==='socin'?` · <label style="display:inline;font-weight:400"><input type="checkbox" class="la" data-id="${x.id}" ${x.auto?'checked':''}> tự đẩy</label>`:''}</td><td><span class="badge ${x.status==='sent'?'pub':x.status==='failed'?'arc':'prv'}">${{queued:'chờ',sending:'đang gửi',sent:'đã gửi',failed:'lỗi'}[x.status]||x.status}</span>${x.error?`<div class="err" style="font-size:12px">${E(x.error)}</div>`:''}${x.result&&x.result.exported?`<div class="mut" style="font-size:12px">${E(x.result.exported)}</div>`:''}</td><td style="white-space:nowrap">${x.status!=='sent'?`<button class="ghost s ls" data-id="${x.id}">Gửi ngay</button> <button class="ghost s ld" data-id="${x.id}">Xóa</button>`:''}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">Chưa có lịch.</td></tr>'}</tbody></table></div>`}
function wire(){const q=s=>document.querySelector(s),qa=s=>document.querySelectorAll(s);
 if(q('#c_ok'))q('#c_ok').onclick=function(){busy(this,async()=>{const ch=[...qa('.ch:checked')].map(x=>{const sel=document.querySelector(`.ca[data-p="${x.value}"]`),o=sel&&sel.selectedOptions[0],old=(P&&P.channels.find(c=>c.platform===x.value))||{};return {platform:x.value,adapter:old.adapter||'socin',accountId:sel?sel.value:(old.accountId||''),accountName:sel&&sel.value?o.textContent:(old.accountName||'')}});
  P=(await api('/api/cr/project/save',{id:P&&P.id,name:$('c_name').value,concept:$('c_concept').value,audience:$('c_aud').value,tone:$('c_tone').value,channels:ch})).project;say('Đã lưu');cur='ideas';draw()})};
 qa('.idea').forEach(e=>e.onclick=()=>{P.idea=+e.dataset.i;qa('.idea').forEach(x=>x.classList.toggle('on',x===e))});
 if(q('#i_gen'))q('#i_gen').onclick=function(){busy(this,async()=>{P=(await api('/api/cr/ai/ideas',{id:P.id})).project;draw()})};
 if(q('#i_sc'))q('#i_sc').onclick=function(){if(P.idea==null)return say('Chọn một ý tưởng',1);busy(this,async()=>{P=(await api('/api/cr/ai/script',{id:P.id,idea:P.idea})).project;cur='script';draw()})};
 if(q('#s_sync'))q('#s_sync').onclick=function(){busy(this,async()=>{P=(await api('/api/cr/ai/style',{id:P.id})).project;draw();say('Đã đồng bộ nhân vật và phong cách')})};
 if(q('#s_save'))q('#s_save').onclick=function(){busy(this,async()=>{const s=P.script;s.title=$('s_title').value;s.hook=$('s_hook').value;s.character=$('s_char').value;s.style=$('s_sty').value;qa('.sx').forEach(e=>{const sc=s.scenes[+e.dataset.i];sc[e.dataset.k]=e.dataset.k==='seconds'?+e.value:e.value});qa('.cx').forEach(e=>{const c=s.captions[e.dataset.p];c[e.dataset.k]=e.dataset.k==='hashtags'?e.value.split(/\s+/).filter(Boolean):e.value});P=(await api('/api/cr/script/save',{id:P.id,script:s})).project;say('Đã lưu kịch bản')})};
 const gen=async(i,s)=>{P=(await api('/api/cr/image/generate',{id:P.id,scene:i,source:s})).project};
 qa('.gi').forEach(b=>b.onclick=()=>busy(b,async()=>{await gen(+b.dataset.i,b.dataset.s);draw()}));
 const all=(s)=>async function(){STOP=false;const st=$('g_stop'),pg=$('g_prog');if(st)st.hidden=false;busy(this,async()=>{let n=0;for(let i=1;i<=P.script.scenes.length;i++){if(STOP)break;if(pg)pg.textContent=`Đang vẽ cảnh ${i}/${P.script.scenes.length}…`;await gen(i,s);n++}draw();say(STOP?`Đã dừng sau ${n} cảnh`:'Đã tạo ảnh cho mọi cảnh')})};
 if(q('#dt_on'))q('#dt_on').onclick=async()=>{try{SET=(await api('/api/cr/image/enable',{url:DT.url,turbo:true})).settings;say('Đã bật ảnh AI');draw()}catch(e){say(e.message,1)}};if(q('#dt_re'))q('#dt_re').onclick=()=>{DT=null;draw()};
 if(q('#g_stop'))q('#g_stop').onclick=()=>{STOP=true;say('Sẽ dừng sau cảnh đang vẽ')};
 if(q('#g_seed'))q('#g_seed').onclick=async()=>{P=(await api('/api/cr/image/reseed',{id:P.id})).project;say('Đã đổi seed, bấm vẽ lại để có bộ ảnh mới')};
 if(q('#g_src'))q('#g_src').onchange=async()=>{try{SET=(await api('/api/cr/settings/save',{imageSource:$('g_src').value})).settings}catch(e){say(e.message,1)}};if(q('#g_ai'))q('#g_ai').onclick=all(SET.imageSource||'card');
 qa('.up').forEach(inp=>inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{P=(await api('/api/cr/image/upload',{id:P.id,scene:+inp.dataset.i,dataUrl:r.result})).project;draw()}catch(e){say(e.message,1)}};r.readAsDataURL(f)});
 if(q('#v_stop'))q('#v_stop').onclick=async()=>{try{await api('/api/cr/video/cancel',{id:P.id});say('Đang dừng…')}catch(e){say(e.message,1)}};
 if(q('#v_eng')){const sy=()=>{VO={eng:$('v_eng').value,redraw:$('v_redraw').checked,auto:$('v_auto').checked,voice:$('v_voice').checked,cap:$('v_cap').checked}};['v_eng','v_redraw','v_auto','v_voice','v_cap'].forEach(i=>$(i).onchange=()=>{sy();if(i==='v_eng')api('/api/cr/settings/save',{videoEngine:$('v_eng').value==='gemini'?'gemini':'ffmpeg'}).then(r=>{SET=r.settings}).catch(()=>{})})}
 if(q('#v_go'))q('#v_go').onclick=async()=>{try{P=(await api('/api/cr/video/render',{id:P.id,voice:$('v_voice').checked,captions:$('v_cap').checked,engine:$('v_eng').value,redraw:$('v_redraw').checked,autoImages:$('v_auto').checked,imageSource:SET.imageSource})).project;draw();poll()}catch(e){say(e.message,1)}};
 if(q('#l_plan'))q('#l_plan').onclick=function(){busy(this,async()=>{P=(await api('/api/cr/schedule/plan',{id:P.id,startDate:$('l_date').value,hours:[+$('l_hour').value],gapMinutes:+$('l_gap').value})).project;draw()})};
 qa('.lt').forEach(e=>e.onchange=async()=>{try{P=(await api('/api/cr/schedule/item',{id:P.id,item:e.dataset.id,runAt:new Date(e.value).toISOString()})).project;say('Đã đổi giờ')}catch(x){say(x.message,1)}});
 qa('.la').forEach(e=>e.onchange=async()=>{try{P=(await api('/api/cr/schedule/item',{id:P.id,item:e.dataset.id,auto:e.checked})).project}catch(x){say(x.message,1)}});
 qa('.ld').forEach(b=>b.onclick=async()=>{P=(await api('/api/cr/schedule/item',{id:P.id,item:b.dataset.id,delete:true})).project;draw()});
 qa('.ls').forEach(b=>b.onclick=()=>busy(b,async()=>{const r=await fetch('/api/cr/schedule/send',{method:'POST',body:JSON.stringify({id:P.id,item:b.dataset.id})}).then(r=>r.json());P=r.project||P;draw();say(r.ok?'Đã gửi':'Gửi lỗi: '+r.error,!r.ok)}))}
async function poll(){clearTimeout(poll.t);poll.t=setTimeout(async()=>{try{P=(await api('/api/cr/project?id='+P.id)).project;if(cur==='video')draw();if(P.video&&P.video.status==='rendering')poll();else if(P.video&&P.video.status==='done')say('Video đã dựng xong')}catch{}},2500)}

async function st(){const d=await api('/api/cr/stats');const S=d.byStatus;
 $('tp_st').innerHTML=`<div class="kpis">${UI.kpi('Dự án',d.projects)}${UI.kpi('Video đã dựng',d.videos)}${UI.kpi('Mục lịch',d.items)}${UI.kpi('Đã gửi',S.sent||0,{color:'var(--ok)'})}${UI.kpi('Lỗi',S.failed||0,{color:'var(--bad)'})}</div><div class="grid2">
