<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><title>S Hub</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1318;--side:#12171e;--card:#171d25;--line:#263040;--tx:#e6edf5;--mut:#8696a8;--ok:#3fb97a;--bad:#ef5b5b;--warn:#e0b341;--acc:#4c9aff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 -apple-system,Segoe UI,sans-serif;display:grid;grid-template-columns:230px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 10px;gap:2px}
aside h1{font-size:17px;margin:2px 8px 14px}aside h1 small{display:block;color:var(--mut);font-size:11px;font-weight:400}
.nav{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--tx)}
.nav:hover{background:#1a222c}.nav.on{background:#1f2a38;box-shadow:inset 3px 0 var(--acc)}
.nav .i{width:22px;text-align:center}.nav .n{flex:1}.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.on{background:var(--ok)}.dot.off{background:var(--bad)}.sep{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 10px 4px}
main{display:flex;flex-direction:column;min-width:0;height:100vh}
.bar{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--line)}.bar b{flex:1;font-size:15px}
button{background:var(--acc);color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:600}button.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
iframe{flex:1;border:0;width:100%;background:#fff}#home{padding:20px 24px;overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card .t{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px}.card .t span.e{font-size:22px}.card p{margin:0;color:var(--mut);flex:1}
.st{font-size:12px;color:var(--mut)}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:22px 0 10px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}.pill{padding:2px 8px;border-radius:99px;font-size:12px}
.msg{padding:40px;text-align:center;color:var(--mut)}
</style></head><body>
<aside>
<h1>S Hub<small>Trung tâm quản lý tool</small></h1>
<div class="nav on" data-id="home"><span class="i">🏠</span><span class="n">Tổng quan</span></div>
<div class="sep">Công cụ dev</div><div id="devnav"></div>
<div class="sep">Ứng dụng</div><div id="appnav"></div>
<div style="flex:1"></div><div class="st" style="padding:8px 10px" id="clock"></div>
</aside>
<main>
<div class="bar"><b id="ttl">Tổng quan</b><button class="ghost" id="reload" style="display:none">Tải lại</button><button class="ghost" id="pop" style="display:none">Mở cửa sổ riêng</button></div>
<div id="home"></div><iframe id="fr" style="display:none"></iframe><div id="msg" class="msg" style="display:none"></div>
</main>
<script>
const $=id=>document.getElementById(id);let apps=[],cur='home';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dev=a=>a.type==='web'||a.type==='internal';
async function load(){try{apps=(await (await fetch('/api/apps')).json()).apps}catch{apps=[]}drawNav();if(cur==='home')home()}
function dotCls(a){return a.online===true?'on':a.online===false?'off':''}
function drawNav(){
 const mk=a=>`<div class="nav ${cur===a.id?'on':''}" data-id="${a.id}"><span class="i">${a.icon||'📦'}</span><span class="n">${esc(a.name)}</span><i class="dot ${dotCls(a)}"></i></div>`;
 $('devnav').innerHTML=apps.filter(dev).map(mk).join('');$('appnav').innerHTML=apps.filter(a=>!dev(a)).map(mk).join('');
 document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>go(n.dataset.id));
 document.querySelector('.nav[data-id=home]').classList.toggle('on',cur==='home')}
function status(a){return a.type==='launch'?'Ứng dụng máy':a.online?'Đang chạy':'Chưa chạy'}
function home(){
 $('home').innerHTML=`<div class="grid">${apps.map(a=>`<div class="card"><div class="t"><span class="e">${a.icon||'📦'}</span>${esc(a.name)}<i class="dot ${dotCls(a)}" style="margin-left:auto"></i></div><p>${esc(a.desc||'')}</p><div class="st">${status(a)}</div>
 <button data-open="${a.id}">${a.type==='launch'?'Mở app':a.online||a.type==='internal'?'Mở':a.canStart?'Khởi động':'Chưa chạy'}</button></div>`).join('')}</div>
 <h2>Kiểm tra gần đây (S Test Hub)</h2><div id="rep"></div>`;
 $('home').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>go(b.dataset.open));
 fetch('/api/reports').then(r=>r.json()).then(d=>{$('rep').innerHTML=d.reports.slice(0,8).map(p=>`<div class="row"><span>${esc(p.repo)}</span><span><span class="pill" style="background:${p.failed?'#4a2226':'#1f3d2e'}">${p.failed?p.failed+' lỗi':'đạt'}</span> <span class="st">${new Date(p.at).toLocaleString('vi-VN')}</span></span></div>`).join('')||'<span class="st">Chưa có lần chạy nào. Mở S Test Hub để chạy kiểm tra repo.</span>'})}
async function go(id){
 cur=id;location.hash=id;drawNav();
 const show=(h,f,m)=>{$('home').style.display=h?'block':'none';$('fr').style.display=f?'block':'none';$('msg').style.display=m?'block':'none';$('reload').style.display=$('pop').style.display=f?'':'none'};
 if(id==='home'){$('ttl').textContent='Tổng quan';show(1,0,0);return load()}
 const a=apps.find(x=>x.id===id);if(!a)return;$('ttl').textContent=a.name;
 if(a.type==='launch'){const r=await fetch('/api/launch',{method:'POST',body:JSON.stringify({id})}).then(r=>r.json());show(0,0,1);$('msg').textContent=r.error||`Đã gửi lệnh mở ${a.name}. Ứng dụng chạy ở cửa sổ riêng trên máy.`;return}
 let u=a.online?a.url:null;
 if(!u&&a.canStart){show(0,0,1);$('msg').textContent='Đang khởi động '+a.name+'…';await fetch('/api/launch',{method:'POST',body:JSON.stringify({id})});
  for(let i=0;i<20&&!u;i++){await new Promise(r=>setTimeout(r,1500));await load();const n=apps.find(x=>x.id===id);if(n&&n.online)u=n.url}}
 if(!u){show(0,0,1);$('msg').innerHTML=`${esc(a.name)} chưa chạy. Hãy mở app này lên (hoặc điền <code>url</code> / <code>startCommand</code> cho "${esc(a.id)}" trong config.json), rồi bấm lại.`;return}
 show(0,1,0);$('fr').src=u;$('pop').onclick=()=>window.open(u,'_blank');$('reload').onclick=()=>{$('fr').src=u}}
setInterval(()=>{$('clock').textContent=new Date().toLocaleString('vi-VN')},1000);
setInterval(()=>{if(cur==='home'||true)fetch('/api/apps').then(r=>r.json()).then(d=>{apps=d.apps;drawNav()}).catch(()=>{})},15000);
load().then(()=>{const h=location.hash.slice(1);if(h&&h!=='home')go(h)});
</script></body></html>
